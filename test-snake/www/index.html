<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c1110;
      --panel: #151c1a;
      --panel-2: #1d2624;
      --text: #e8f5ee;
      --muted: #8fa69d;
      --accent: #4ade80;
      --grid: #10221c;
      --snake: #4ade80;
      --snake-head: #86efac;
      --food: #f87171;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(900px 400px at 50% -10%, #12352a 0%, transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    .game {
      width: min(100%, 440px);
      margin: 16px;
      padding: 18px;
      border-radius: 24px;
      background: var(--panel);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 650;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .score {
      display: flex;
      align-items: baseline;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--panel-2);
      font-variant-numeric: tabular-nums;
    }

    .score .label {
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .score .value {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
    }

    .board-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      overflow: hidden;
      background: #0a1410;
      border: 1px solid #1c2b25;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(6, 12, 10, 0.72);
      text-align: center;
      padding: 20px;
    }

    .overlay.hidden { display: none; }

    .overlay .title {
      font-size: 1.6rem;
      font-weight: 700;
      margin: 0 0 8px;
    }

    .overlay .subtitle {
      color: var(--muted);
      margin: 0 0 18px;
      line-height: 1.45;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      border: 0;
      border-radius: 14px;
      min-height: 52px;
      padding: 0 18px;
      font: inherit;
      font-weight: 600;
      color: var(--text);
      background: var(--panel-2);
      cursor: pointer;
    }

    button:hover { background: #26332f; }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    button.primary {
      background: var(--accent);
      color: #06281a;
    }

    button.primary:hover { filter: brightness(1.08); }

    .hint {
      margin: 0;
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
    }

    kbd {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 6px;
      background: var(--panel-2);
      border: 1px solid #2b3b36;
      font-family: inherit;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <main class="game">
    <div class="header">
      <h1>Snake</h1>
      <div class="score" aria-live="polite">
        <span class="label">Score</span>
        <span class="value" id="score">0</span>
      </div>
    </div>

    <div class="board-wrap">
      <canvas id="board" width="400" height="400" aria-label="Plateau du jeu Snake"></canvas>
      <div class="overlay hidden" id="overlay">
        <div>
          <p class="title" id="overlay-title">Prêt ?</p>
          <p class="subtitle" id="overlay-text">Utilise les flèches du clavier pour guider le serpent.</p>
          <div class="controls">
            <button type="button" class="primary" id="play">Jouer</button>
          </div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button type="button" id="replay">Rejouer</button>
    </div>

    <p class="hint">
      Flèches du clavier pour se déplacer · <kbd>Espace</kbd> pour relancer
    </p>
  </main>

  <script>
(function () {
      "use strict";

      const canvas = document.getElementById("board");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlay-title");
      const overlayText = document.getElementById("overlay-text");
      const playBtn = document.getElementById("play");
      const replayBtn = document.getElementById("replay");

      const COLS = 20;
      const ROWS = 20;
      const CELL = canvas.width / COLS;
      const TICK_MS = 110;

      const DIRS = {
        ArrowUp: { x: 0, y: -1 },
        ArrowDown: { x: 0, y: 1 },
        ArrowLeft: { x: -1, y: 0 },
        ArrowRight: { x: 1, y: 0 }
      };

      let snake = [];
      let dir = { x: 1, y: 0 };
      let nextDir = { x: 1, y: 0 };
      let food = null;
      let score = 0;
      let running = false;
      let timer = null;

      function reset() {
        snake = [
          { x: 5, y: 10 },
          { x: 4, y: 10 },
          { x: 3, y: 10 }
        ];
        dir = { x: 1, y: 0 };
        nextDir = { x: 1, y: 0 };
        score = 0;
        scoreEl.textContent = String(score);
        placeFood();
        draw();
      }

      function placeFood() {
        const occupied = new Set(snake.map((s) => s.x + "," + s.y));
        let cell;
        do {
          cell = {
            x: Math.floor(Math.random() * COLS),
            y: Math.floor(Math.random() * ROWS)
          };
        } while (occupied.has(cell.x + "," + cell.y));
        food = cell;
      }

      function showOverlay(title, text, buttonLabel) {
        overlayTitle.textContent = title;
        overlayText.textContent = text;
        playBtn.textContent = buttonLabel;
        overlay.classList.remove("hidden");
      }

      function hideOverlay() {
        overlay.classList.add("hidden");
      }

      function start() {
        if (running) return;
        reset();
        hideOverlay();
        running = true;
        lastTime = performance.now();
        timer = setInterval(step, TICK_MS);
      }

      function stop() {
        running = false;
        if (timer) {
          clearInterval(timer);
          timer = null;
        }
      }

      function gameOver() {
        stop();
        showOverlay("Partie terminée", "Score final : " + score, "Rejouer");
      }

      function step() {
        dir = nextDir;
        const head = snake[0];
        const nx = head.x + dir.x;
        const ny = head.y + dir.y;

        if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) {
          gameOver();
          return;
        }

        const eating = food && food.x === nx && food.y === ny;
        const bodyToCheck = eating ? snake : snake.slice(0, -1);
        if (bodyToCheck.some((s) => s.x === nx && s.y === ny)) {
          gameOver();
          return;
        }

        snake.unshift({ x: nx, y: ny });

        if (eating) {
          score += 10;
          scoreEl.textContent = String(score);
          placeFood();
        } else {
          snake.pop();
        }

        draw();
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = getComputedStyle(document.documentElement)
          .getPropertyValue("--grid")
          .trim() || "#10221c";
        for (let y = 0; y < ROWS; y++) {
          for (let x = 0; x < COLS; x++) {
            if ((x + y) % 2 === 0) {
              ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
            }
          }
        }

        if (food) {
          ctx.fillStyle = getComputedStyle(document.documentElement)
            .getPropertyValue("--food")
            .trim() || "#f87171";
          ctx.beginPath();
          ctx.arc(
            food.x * CELL + CELL / 2,
            food.y * CELL + CELL / 2,
            CELL / 2 - 2,
            0,
            Math.PI * 2
          );
          ctx.fill();
        }

        snake.forEach((segment, index) => {
          ctx.fillStyle = index === 0
            ? (getComputedStyle(document.documentElement)
                .getPropertyValue("--snake-head")
                .trim() || "#86efac")
            : (getComputedStyle(document.documentElement)
                .getPropertyValue("--snake")
                .trim() || "#4ade80");
          const pad = 1.5;
          ctx.beginPath();
          ctx.roundRect(
            segment.x * CELL + pad,
            segment.y * CELL + pad,
            CELL - pad * 2,
            CELL - pad * 2,
            4
          );
          ctx.fill();
        });
      }

      function setDirection(newDir) {
        const opposite = newDir.x === -dir.x && newDir.y === -dir.y;
        if (opposite) return;
        nextDir = newDir;
      }

      playBtn.addEventListener("click", start);
      replayBtn.addEventListener("click", start);

      document.addEventListener("keydown", (event) => {
        const key = event.key;
        if (key === " " || key === "Spacebar") {
          event.preventDefault();
          start();
          return;
        }
        if (!DIRS[key]) return;
        event.preventDefault();
        if (!running) {
          start();
        }
        setDirection(DIRS[key]);
      });

      reset();
      showOverlay("Prêt ?", "Utilise les flèches du clavier pour guider le serpent.", "Jouer");
    })();
  </script>
</body>
</html>
